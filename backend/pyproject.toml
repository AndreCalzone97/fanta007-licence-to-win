[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fanta007-backend"
version = "0.1.0"
description = "Backend data-driven di Fanta007 — Licence to Win"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "openpyxl>=3.1,<4.0",
  "pydantic>=2.11,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "pytest-cov>=6.2,<7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

